name: den-tv launcher

# Builds the launcher APK (with the looks and the den-mix theme bundled) and runs its unit tests whenever
# the launcher, the looks or the theme change. The APK is attached to the run as an artifact to download.
on:
  push:
    paths: ["launcher/**", "looks/**", "themes/den-mix/**", ".github/workflows/launcher.yml"]
  pull_request:
    paths: ["launcher/**", "looks/**", "themes/den-mix/**", ".github/workflows/launcher.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Test and build
        working-directory: launcher
        run: chmod +x gradlew && ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: den-tv-launcher
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
