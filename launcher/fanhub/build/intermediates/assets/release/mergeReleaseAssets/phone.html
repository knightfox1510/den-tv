<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>den-tv</title>
<style>
  :root { --bg: #08080b; --card: #15151c; --line: #2a2a34; --text: #f2f2f6; --dim: #a09dac; --acc: #ff4d6d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 26px; margin: 4px 0 2px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  p { color: var(--dim); margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  input, textarea { width: 100%; background: #0d0d12; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
  input.code { font-size: 32px; letter-spacing: .4em; text-align: center; }
  button { appearance: none; border: 0; border-radius: 10px; background: var(--acc); color: #fff; font: 600 16px/1 inherit; padding: 13px 18px; margin-top: 10px; width: 100%; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .looks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .look { text-align: left; background: #0d0d12; border: 1px solid var(--line); margin: 0; padding: 12px; font-weight: 500; line-height: 1.25; }
  .look small { display: block; color: var(--dim); font-weight: 400; margin-top: 3px; font-size: 13px; }
  .look.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
  .msg { min-height: 1.4em; color: var(--dim); margin-top: 10px; }
  .msg.bad { color: #ff7a7a; }
  [hidden] { display: none !important; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
</style>
</head>
<body>
<main>
  <h1>den-tv</h1>
  <p>Settings for the TV, from your phone.</p>

  <section id="pair" hidden>
    <div class="card">
      <p>Enter the 4-digit code on the TV's Fan Hub screen.</p>
      <input id="code" class="code" inputmode="numeric" maxlength="4" autocomplete="one-time-code" aria-label="Code from the TV">
      <button id="pairBtn">Pair this phone</button>
      <div id="pairMsg" class="msg" role="status"></div>
    </div>
  </section>

  <section id="app" hidden>
    <h2>Look</h2>
    <p>Tap a look to put it on Home. It changes when you leave the Fan Hub screen on the TV.</p>
    <div id="looks" class="looks"></div>
    <div id="lookMsg" class="msg" role="status"></div>

    <h2>Fan Hub</h2>
    <div class="card">
      <label for="teams">Teams, one per line</label>
      <textarea id="teams" rows="4" placeholder="FC Barcelona&#10;India&#10;Mumbai Indians"></textarea>
      <label for="shows">Shows, one per line</label>
      <textarea id="shows" rows="4" placeholder="One Piece&#10;Jujutsu Kaisen"></textarea>
      <button id="saveHub">Save</button>
      <div id="hubMsg" class="msg" role="status"></div>
    </div>
  </section>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const say = (el, text, bad) => { el.textContent = text; el.classList.toggle('bad', !!bad); };
  async function api(path, body) {
    const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    let j = {}; try { j = await r.json(); } catch (e) {}
    return { status: r.status, json: j };
  }
  function lines(id) { return $(id).value.split('\n').map((s) => s.trim()).filter(Boolean); }
  function renderLooks(looks) {
    const box = $('looks'); box.innerHTML = '';
    looks.forEach((l) => {
      const b = document.createElement('button');
      b.className = 'look' + (l.on ? ' on' : ''); b.type = 'button';
      b.textContent = l.name;
      if (l.category) { const s = document.createElement('small'); s.textContent = l.category; b.appendChild(s); }
      b.setAttribute('aria-pressed', l.on ? 'true' : 'false');
      b.addEventListener('click', async () => {
        say($('lookMsg'), 'Putting on ' + l.name + '…');
        const r = await api('/api/look', { id: l.id });
        if (r.json.ok) { looks.forEach((x) => { x.on = x.id === l.id; }); renderLooks(looks); say($('lookMsg'), l.name + ' is on. Leave the Fan Hub screen on the TV to see it.'); }
        else say($('lookMsg'), r.json.error || 'The TV didn\'t take it. Try again.', true);
      });
      box.appendChild(b);
    });
  }
  async function load() {
    let r;
    try { r = await api('/api/state'); } catch (e) { $('pair').hidden = false; say($('pairMsg'), 'Can\'t reach the TV. Is the Fan Hub screen open?', true); return; }
    if (r.status === 401) { $('pair').hidden = false; $('app').hidden = true; $('code').focus(); return; }
    $('pair').hidden = true; $('app').hidden = false;
    if (r.json.looksError) say($('lookMsg'), r.json.looksError, true);
    renderLooks(r.json.looks || []);
    $('teams').value = (r.json.teams || []).join('\n');
    $('shows').value = (r.json.shows || []).join('\n');
  }
  $('pairBtn').addEventListener('click', async () => {
    const r = await api('/api/pair', { code: $('code').value.trim() });
    if (r.status === 200) load(); else say($('pairMsg'), r.json.error || 'That didn\'t work. Check the code on the TV.', true);
  });
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pairBtn').click(); });
  $('saveHub').addEventListener('click', async () => {
    say($('hubMsg'), 'Saving and looking up the teams…');
    const r = await api('/api/fanhub', { teams: lines('teams'), shows: lines('shows') });
    if (!r.json.ok) { say($('hubMsg'), r.json.error || 'Couldn\'t save.', true); return; }
    const miss = r.json.missing || [];
    say($('hubMsg'), miss.length ? 'Saved. Couldn\'t find: ' + miss.join(', ') + '. Check the spelling.' : 'Saved. Home updates in a minute.', miss.length > 0);
  });
  load();
})();
</script>
</body>
</html>
