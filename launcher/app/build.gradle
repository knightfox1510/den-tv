plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName 'den-0.1 (cleanyourtv 3.1)'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'den.screens', project.findProperty('den.screens') ?: ''
            // Robolectric fetches its Android runtime itself; -Probolectric.repo=<maven mirror> points it elsewhere.
            if (project.hasProperty('robolectric.repo')) systemProperty 'robolectric.dependency.repo.url', project.property('robolectric.repo')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// den-tv: the looks (repo looks/) and the den-mix theme (repo themes/den-mix/) go into the APK from the repo,
// so there is one copy of each. DenTheme copies the theme out on the first start; DenLooks reads the looks.
def denAssets = layout.buildDirectory.dir('generated/den-assets')
def copyDenAssets = tasks.register('copyDenAssets', Sync) {
    into denAssets
    from('../../looks') { include '*.json'; into 'den/looks' }
    from('../../themes/den-mix') { include 'config.json', 'wallpapers/**'; into 'den/theme' }
}
android.sourceSets.main.assets.srcDir(denAssets)
tasks.named('preBuild') { dependsOn copyDenAssets }

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // den-tv: renders den-tv's screens to PNGs in a test (DenScreensTest, run with -Pden.screens); not part of the APK.
    testImplementation 'org.robolectric:robolectric:4.13'
}
